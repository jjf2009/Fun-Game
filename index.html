<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0d0f1a" />
    <title>Hostel Nights</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #0d0f1a; overflow: hidden; touch-action: none; }
      #game { width: 100vw; height: 100vh; }
      #rotate { display: none; position: fixed; inset: 0; color: #fff; font: 18px monospace; background: #0d0f1a;
        align-items: center; justify-content: center; text-align: center; padding: 24px; z-index: 10; }
      @media (orientation: portrait) and (max-width: 700px) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">📱↻<br /><br />Rotate your phone sideways to play Hostel Nights</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
