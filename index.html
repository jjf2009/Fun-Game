<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0f1a" />
    <meta name="description" content="A free comedy game about hostel life: knock on doors and run, dodge the warden, escape the seniors, beat the outsider gang, and speak up against ragging. Play on phone or PC, solo or with a friend." />
    <!-- "Add to Home Screen" support: opens full screen like an app -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Hostel Nights" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <!-- Link previews (WhatsApp, LinkedIn, Instagram, X...). Image URLs must be full addresses. -->
    <link rel="canonical" href="https://jjf2009.github.io/hostel-nights/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hostel Nights" />
    <meta property="og:url" content="https://jjf2009.github.io/hostel-nights/" />
    <meta property="og:title" content="Hostel Nights: Knock. Run. Survive. Speak up." />
    <meta property="og:description" content="Knock on doors and run, dodge the warden, escape the seniors and save the hostel. Free on phone &amp; PC, with co-op, a story mode and an online TOP 10." />
    <meta property="og:image" content="https://jjf2009.github.io/hostel-nights/og-image.jpg" />
    <meta property="og:image:secure_url" content="https://jjf2009.github.io/hostel-nights/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Hostel Nights: pixel-art hostel game with the warden, seniors, Bunty and Bike Bhai" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hostel Nights: Knock. Run. Survive. Speak up." />
    <meta name="twitter:description" content="A free comedy game about hostel life. Phone &amp; PC, co-op, story mode, online TOP 10." />
    <meta name="twitter:image" content="https://jjf2009.github.io/hostel-nights/og-image.jpg" />
    <title>Hostel Nights</title>
    <style>
      html, body {
        margin: 0; padding: 0; height: 100%; background: #0d0f1a; overflow: hidden;
        touch-action: none; overscroll-behavior: none;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game { position: fixed; inset: 0; }
      canvas { display: block; }
      #rotate {
        display: none; position: fixed; inset: 0; color: #ffe066; font: 18px monospace; background: #0d0f1a;
        flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; z-index: 10;
      }
      #rotate .phone { font-size: 64px; animation: turn 1.6s ease-in-out infinite; }
      @keyframes turn { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(90deg); } }
      /* Only phones held upright see this */
      @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">
      <div class="phone">📱</div>
      <p>Turn your phone sideways to play <b>Hostel Nights</b></p>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
